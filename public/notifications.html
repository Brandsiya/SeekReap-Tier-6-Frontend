        /* ─── ROOT VARIABLES ─────────────────────────────────────────────── */
        :root {
            --bg: #f5f4ef;
            --bg2: #ffffff;
            --bg3: #eeebe3;
            --bg4: #e2ded5;
            --border: #dad6cc;
            --border-light: #eae6db;
            --text: #171717;
            --text-dim: #5c5952;
            --text-muted: #8e8a7f;
            --primary: #115e36;
            --primary-hover: #0b4526;
            --primary-light: #e6f2eb;
            --danger: #b22222;
            --warning: #cc8400;
            --info: #1a6f9a;
            --gold: #966f1c;
            --gold-light: #f7f3e3;
            --gold-dark: #6e5012;
            --gold-border: #dfd4b3;
            --green: #115e36;
            --radius: 20px;
            --radius-sm: 12px;
            --radius-lg: 28px;
            --shadow: 0 4px 16px rgba(0,0,0,0.04);
            --shadow-lg: 0 12px 36px rgba(0,0,0,0.08);
            --transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* ─── SIDEBAR ──────────────────────────────────────────────────────── */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--bg2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 200;
            transition: transform 0.3s ease;
            overflow: hidden;
            transform: translateX(-100%);
        }
        .sidebar.mobile-open { transform: translateX(0); }
        .sidebar-header {
            padding: 20px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            min-height: 72px;
        }
        .sidebar-header .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
        }
        .sidebar-header .logo span { color: var(--primary); }
        .sidebar-close-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            transition: var(--transition);
        }
        .sidebar-close-btn:hover { color: var(--text); }

        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            overflow-y: auto;
        }
        .sidebar-nav .nav-section { margin-bottom: 20px; }
        .sidebar-nav .nav-section-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
            padding: 0 10px;
            margin-bottom: 8px;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
        }
        .sidebar-nav a:hover { background: var(--bg3); color: var(--text); }
        .sidebar-nav a.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }
        .sidebar-nav a.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            bottom: 20%;
            width: 3px;
            background: var(--primary);
            border-radius: 0 3px 3px 0;
        }
        .sidebar-nav a .nav-icon { width: 20px; text-align: center; font-size: 15px; flex-shrink: 0; }
        .sidebar-nav a .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-nav a .nav-badge {
            background: var(--danger);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .sidebar-nav .nav-divider {
            height: 1px;
            background: var(--border);
            margin: 8px 14px;
        }

        .sidebar-footer {
            padding: 16px 12px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sidebar-footer .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        .sidebar-footer .user-card:hover { background: var(--bg3); }
        .sidebar-footer .user-avatar {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }
        .sidebar-footer .user-info { flex: 1; overflow: hidden; }
        .sidebar-footer .user-info .name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-footer .user-info .role {
            font-size: 11px;
            color: var(--text-dim);
        }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 150;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        /* ─── MOBILE HEADER ───────────────────────────────────────────────── */
        .mobile-header {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            z-index: 300;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
            box-shadow: var(--shadow);
        }
        .mobile-header .hamburger-btn {
            display: flex;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            transition: var(--transition);
            border-radius: 8px;
        }
        .mobile-header .hamburger-btn:hover { background: var(--bg3); color: var(--text); }
        .mobile-header .hamburger-btn.hidden { display: none; }
        .mobile-header .mobile-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            white-space: nowrap;
        }
        .mobile-header .mobile-logo span { color: var(--primary); }

        /* ─── MAIN CONTENT ─────────────────────────────────────────────────── */
        .main-content {
            margin-left: 0;
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            width: 100%;
            padding-top: 56px;
        }

        .topbar {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 64px;
            gap: 16px;
            flex-shrink: 0;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-left .back-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
        }
        .topbar-left .back-btn:hover { background: var(--bg3); color: var(--text); }
        .topbar-left .page-title {
            font-size: 18px;
            font-weight: 600;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-icon-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 16px;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .topbar-icon-btn:hover { background: var(--bg3); color: var(--text); }

        /* ─── TOAST ────────────────────────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg2);
            border-left: 4px solid var(--primary);
            padding: 16px 24px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            z-index: 1100;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s cubic-bezier(0.4,0,0.2,1);
            max-width: 350px;
            transition: opacity 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ─── RESPONSIVE ───────────────────────────────────────────────────── */
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.mobile-open { transform: translateX(0); }
            .sidebar.mobile-open .sidebar-close-btn { display: block; }
            .main-content { padding-top: 56px; }
            .mobile-header { display: flex; }
            .topbar { padding: 0 16px; height: 56px; }
        }
        @media (max-width: 768px) {
            .topbar { padding: 0 12px; height: 52px; }
        }
    </style>
</head>
